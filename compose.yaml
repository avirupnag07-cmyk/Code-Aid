services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CODE_AID_DATABASE: /app/backend/data/code_aid.sqlite3
      CODE_AID_STORAGE: /app/backend/data/investigations
      CODE_AID_SAMPLES: /app/samples
      CODE_AID_ALLOWED_ORIGINS: http://localhost:5173
      CODE_AID_DOCKER_IMAGE: code-aid-runner:0.1.0
      CODE_AID_GITHUB_CLIENT_ID: ${CODE_AID_GITHUB_CLIENT_ID:-}
      CODE_AID_GITHUB_CLIENT_SECRET: ${CODE_AID_GITHUB_CLIENT_SECRET:-}
      CODE_AID_GITHUB_REDIRECT_URI: ${CODE_AID_GITHUB_REDIRECT_URI:-http://localhost:8000/api/github/callback}
      CODE_AID_OAUTH_COOKIE_SECRET: ${CODE_AID_OAUTH_COOKIE_SECRET:-}
    volumes:
      - code_aid_data:/app/backend/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  code_aid_data:
